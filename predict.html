<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#eef2fb" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Dự đoán LC79</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?t=10008" />
  <link rel="stylesheet" href="predict.css?t=10008" />
</head>
<body>
  <header class="pred-header">
    <button id="backBtn" class="back-btn" aria-label="Quay lại"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5.5"/><path d="M11.5 6l-6 6 6 6"/></svg></button>
    <div class="pred-title-wrap">
      <div class="pred-title" id="predTitle">Dự đoán</div>
      <div class="pred-subtitle">Lumina AI Engine</div>
    </div>
    <div class="status-pill"><span class="dot"></span>LIVE</div>
  </header>

  <main class="pred-main">
    <section class="pred-card" id="predCard">
      <div class="pred-glow"></div>
      <div class="pred-label">Dự đoán phiên hiện tại</div>
      <div class="pred-result" id="predResult"><span class="skeleton"></span></div>
      <div class="conf-wrap">
        <div class="conf-bar"><div class="conf-fill" id="confFill"></div></div>
        <div class="conf-text" id="confText"></div>
      </div>
      <div class="pred-chips" id="predChips"></div>
      <button class="refresh-btn" id="refreshBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 9.2A8 8 0 0 1 18.9 6.4"/><path d="M19.2 14.8A8 8 0 0 1 5.1 17.6"/><path d="M19.2 2.8v4h-4"/><path d="M4.8 21.2v-4h4"/></svg>Làm mới</button>
      
    </section>

    <section class="history-section">
      <div class="history-title">Lịch Sử Dự Đoán</div>
      <div class="history-list" id="historyList"></div>
    <div class="empty-state" id="emptyHistory">
      <div class="es-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 12H7c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h7c1.1 0 2 .9 2 2v5c0 1.1-.9 2-2 2z"/><path d="M14 2v6h6"/></svg></div>
      <p>Chưa có dữ liệu lịch sử</p>
    </div>
</section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    if (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.SUPABASE_URL.indexOf('YOUR_PROJECT') === -1) {
      window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    }
  </script>
  <script src="predict.js?t=10008"></script>
</body>
</html>
