<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      .robot-main { animation: floatMain 4s ease-in-out infinite; transform-origin: 400px 400px; }
      .robot-head { animation: floatHead 4s ease-in-out infinite; transform-origin: 400px 260px; }
      .left-arm { animation: waveArm 3s ease-in-out infinite; transform-origin: 240px 450px; }
      .right-arm { animation: floatRightArm 4s ease-in-out infinite; transform-origin: 560px 450px; }
      .hologram { animation: floatHolo 3.5s ease-in-out infinite; transform-origin: 610px 310px; }
      .eye-blink { animation: blink 5s infinite; transform-origin: 400px 265px; }
      .pulse-glow { animation: pulse 2.5s ease-in-out infinite; }
      .hover-ring-1 { animation: ringPulse1 2s ease-out infinite; transform-origin: 400px 650px; }
      .hover-ring-2 { animation: ringPulse2 2s ease-out infinite 1s; transform-origin: 400px 650px; }
      .sparkle-spin { animation: spinSlow 10s linear infinite; transform-origin: 610px 270px; }
      .soundwave-1 { animation: waveBar 1.2s ease-in-out infinite; transform-origin: 380px 305px; }
      .soundwave-2 { animation: waveBar 0.9s ease-in-out infinite 0.2s; transform-origin: 390px 305px; }
      .soundwave-3 { animation: waveBar 1.1s ease-in-out infinite 0.4s; transform-origin: 400px 305px; }
      .soundwave-4 { animation: waveBar 0.8s ease-in-out infinite 0.1s; transform-origin: 410px 305px; }
      .soundwave-5 { animation: waveBar 1.3s ease-in-out infinite 0.3s; transform-origin: 420px 305px; }
      @keyframes floatMain { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-16px)} }
      @keyframes floatHead { 0%,100%{transform:translateY(0px) rotate(0deg)} 50%{transform:translateY(-8px) rotate(1.5deg)} }
      @keyframes waveArm { 0%,100%{transform:translateY(0px) rotate(0deg)} 50%{transform:translateY(-12px) rotate(14deg)} }
      @keyframes floatRightArm { 0%,100%{transform:translateY(0px) rotate(0deg)} 50%{transform:translateY(-10px) rotate(-6deg)} }
      @keyframes floatHolo { 0%,100%{transform:translateY(0px) scale(1)} 50%{transform:translateY(-14px) scale(1.04)} }
      @keyframes blink { 0%,46%,50%,96%,100%{transform:scaleY(1)} 48%,98%{transform:scaleY(0.08)} }
      @keyframes pulse { 0%,100%{opacity:0.75} 50%{opacity:1} }
      @keyframes ringPulse1 { 0%{transform:scale(0.7);opacity:0.9} 100%{transform:scale(1.4);opacity:0} }
      @keyframes ringPulse2 { 0%{transform:scale(0.7);opacity:0.9} 100%{transform:scale(1.4);opacity:0} }
      @keyframes spinSlow { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
      @keyframes waveBar { 0%,100%{transform:scaleY(0.5)} 50%{transform:scaleY(1.6)} }
    </style>
    <radialGradient id="bodyWhite" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" /><stop offset="45%" stop-color="#f1f5f9" /><stop offset="78%" stop-color="#cbd5e1" /><stop offset="94%" stop-color="#94a3b8" /><stop offset="100%" stop-color="#38bdf8" />
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#94a3b8" /><stop offset="50%" stop-color="#475569" /><stop offset="100%" stop-color="#1e293b" /></linearGradient>
    <linearGradient id="visorGrad" x1="20%" y1="0%" x2="80%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="40%" stop-color="#090d16" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" /><stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" /></linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a5f3fc" /><stop offset="40%" stop-color="#22d3ee" /><stop offset="100%" stop-color="#0284c7" /></linearGradient>
    <linearGradient id="aiCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22d3ee" /><stop offset="50%" stop-color="#8b5cf6" /><stop offset="100%" stop-color="#ec4899" /></linearGradient>
    <linearGradient id="holoBeam" x1="50%" y1="100%" x2="50%" y2="0%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45" /><stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15" /><stop offset="100%" stop-color="#ec4899" stop-opacity="0" /></linearGradient>
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="blur1" /><feGaussianBlur stdDeviation="16" result="blur2" /><feMerge><feMergeNode in="blur2" /><feMergeNode in="blur1" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020617" flood-opacity="0.55" /></filter>
    <filter id="visorGlow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22d3ee" flood-opacity="0.35" /></filter>
  </defs>
  <!-- hover base -->
  <g><ellipse cx="400" cy="660" rx="95" ry="20" fill="url(#cyanNeon)" opacity="0.35" filter="url(#neonGlow)" /><ellipse class="hover-ring-1" cx="400" cy="650" rx="75" ry="16" fill="none" stroke="#22d3ee" stroke-width="3" filter="url(#neonGlow)" /><ellipse class="hover-ring-2" cx="400" cy="650" rx="75" ry="16" fill="none" stroke="#a855f7" stroke-width="2.5" filter="url(#neonGlow)" /><ellipse cx="400" cy="635" rx="48" ry="10" fill="none" stroke="#a5f3fc" stroke-width="2.5" opacity="0.85" filter="url(#neonGlow)" /></g>
  <!-- robot main -->
  <g class="robot-main">
    <g class="left-arm" filter="url(#softShadow)"><circle cx="268" cy="435" r="14" fill="url(#cyanNeon)" opacity="0.6" filter="url(#neonGlow)" /><path d="M 245,425 C 210,395 170,340 185,305 C 198,275 235,295 255,340 C 270,375 275,410 245,425 Z" fill="url(#bodyWhite)" /><path d="M 200,315 C 212,335 235,375 242,405" fill="none" stroke="url(#cyanNeon)" stroke-width="3.5" stroke-linecap="round" filter="url(#neonGlow)" /><ellipse cx="182" cy="290" rx="8" ry="14" transform="rotate(-25 182 290)" fill="url(#bodyWhite)" /><ellipse cx="200" cy="282" rx="8" ry="15" transform="rotate(-8 200 282)" fill="url(#bodyWhite)" /><ellipse cx="220" cy="286" rx="8" ry="13" transform="rotate(12 220 286)" fill="url(#bodyWhite)" /></g>
    <g filter="url(#softShadow)"><ellipse cx="400" cy="585" rx="46" ry="18" fill="url(#metalGrad)" /><ellipse cx="400" cy="590" rx="34" ry="11" fill="url(#cyanNeon)" filter="url(#neonGlow)" /><path d="M 310,395 C 350,382 450,382 490,395 C 525,410 518,505 475,565 C 445,600 355,600 325,565 C 282,505 275,410 310,395 Z" fill="url(#bodyWhite)" /><path d="M 315,408 C 345,396 410,396 440,402 C 390,410 340,435 322,520 C 304,475 300,420 315,408 Z" fill="#ffffff" opacity="0.65" /><path d="M 310,435 C 340,465 345,525 335,568" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.6" /><path d="M 490,435 C 460,465 455,525 465,568" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.6" /><ellipse cx="400" cy="392" rx="68" ry="16" fill="url(#metalGrad)" /><ellipse cx="400" cy="390" rx="52" ry="11" fill="url(#cyanNeon)" opacity="0.8" filter="url(#neonGlow)" /><g class="pulse-glow"><circle cx="400" cy="475" r="38" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" /><circle cx="400" cy="475" r="30" fill="url(#aiCoreGrad)" filter="url(#neonGlow)" /><path d="M 400,450 Q 400,475 425,475 Q 400,475 400,500 Q 400,475 375,475 Q 400,475 400,450 Z" fill="#ffffff" /><circle cx="400" cy="475" r="23" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.8" /></g></g>
    <g class="right-arm" filter="url(#softShadow)"><circle cx="532" cy="435" r="14" fill="url(#cyanNeon)" opacity="0.6" filter="url(#neonGlow)" /><path d="M 550,425 C 585,415 625,395 620,360 C 615,335 580,340 555,368 C 535,390 530,415 550,425 Z" fill="url(#bodyWhite)" /><path d="M 605,362 C 592,378 570,398 552,410" fill="none" stroke="url(#cyanNeon)" stroke-width="3.5" stroke-linecap="round" filter="url(#neonGlow)" /><ellipse cx="612" cy="350" rx="16" ry="7" fill="url(#cyanNeon)" filter="url(#neonGlow)" /><ellipse cx="612" cy="350" rx="10" ry="4" fill="#ffffff" /></g>
    <g class="hologram"><polygon points="598,350 626,350 685,220 535,220" fill="url(#holoBeam)" /><g transform="translate(545, 195)"><rect x="0" y="0" width="130" height="82" rx="16" fill="#0f172a" fill-opacity="0.65" stroke="url(#cyanNeon)" stroke-width="2" filter="url(#neonGlow)" /><rect x="18" y="20" width="55" height="7" rx="3.5" fill="#22d3ee" opacity="0.9" /><rect x="18" y="36" width="90" height="6" rx="3" fill="#a855f7" opacity="0.8" /><rect x="18" y="50" width="72" height="6" rx="3" fill="#ec4899" opacity="0.8" /><circle cx="105" cy="23" r="5" fill="#4ade80" filter="url(#neonGlow)" /></g><g class="sparkle-spin"><circle cx="610" cy="270" r="46" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.7" /></g><path d="M 610,235 Q 610,270 645,270 Q 610,270 610,305 Q 610,270 575,270 Q 610,270 610,235 Z" fill="url(#aiCoreGrad)" filter="url(#neonGlow)" /><path d="M 610,248 Q 610,270 632,270 Q 610,270 610,292 Q 610,270 588,270 Q 610,270 610,248 Z" fill="#ffffff" /></g>
    <g class="robot-head" filter="url(#softShadow)"><ellipse cx="400" cy="122" rx="52" ry="12" fill="none" stroke="url(#aiCoreGrad)" stroke-width="5" filter="url(#neonGlow)" /><ellipse cx="400" cy="122" rx="52" ry="12" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" /><g><rect x="226" y="220" width="32" height="84" rx="16" fill="url(#metalGrad)" /><rect x="218" y="236" width="12" height="52" rx="6" fill="url(#cyanNeon)" filter="url(#neonGlow)" /><rect x="542" y="220" width="32" height="84" rx="16" fill="url(#metalGrad)" /><rect x="570" y="236" width="12" height="52" rx="6" fill="url(#cyanNeon)" filter="url(#neonGlow)" /></g><path d="M 400,145 C 505,145 558,185 558,265 C 558,342 500,375 400,375 C 300,375 242,342 242,265 C 242,185 295,145 400,145 Z" fill="url(#bodyWhite)" /><path d="M 400,154 C 475,154 522,178 535,220 C 505,190 455,178 400,178 C 345,178 295,190 265,220 C 278,178 325,154 400,154 Z" fill="#ffffff" opacity="0.8" /><rect x="382" y="166" width="36" height="8" rx="4" fill="url(#cyanNeon)" filter="url(#neonGlow)" /><path d="M 400,190 C 488,190 530,215 530,268 C 530,322 485,346 400,346 C 315,346 270,322 270,268 C 270,215 312,190 400,190 Z" fill="url(#visorGrad)" stroke="#334155" stroke-width="3" filter="url(#visorGlow)" /><g class="eye-blink"><g filter="url(#neonGlow)"><ellipse cx="342" cy="262" rx="26" ry="32" fill="url(#cyanNeon)" /><ellipse cx="342" cy="262" rx="18" ry="24" fill="#e0f2fe" /></g><circle cx="350" cy="248" r="7" fill="#ffffff" /><circle cx="333" cy="272" r="3.5" fill="#ffffff" /><g filter="url(#neonGlow)"><ellipse cx="458" cy="262" rx="26" ry="32" fill="url(#cyanNeon)" /><ellipse cx="458" cy="262" rx="18" ry="24" fill="#e0f2fe" /></g><circle cx="466" cy="248" r="7" fill="#ffffff" /><circle cx="449" cy="272" r="3.5" fill="#ffffff" /></g><ellipse cx="305" cy="296" rx="16" ry="8" fill="#ec4899" opacity="0.55" filter="url(#neonGlow)" /><ellipse cx="495" cy="296" rx="16" ry="8" fill="#ec4899" opacity="0.55" filter="url(#neonGlow)" /><g fill="url(#cyanNeon)" filter="url(#neonGlow)"><rect class="soundwave-1" x="377" y="299" width="4" height="12" rx="2" /><rect class="soundwave-2" x="387" y="296" width="4" height="18" rx="2" /><rect class="soundwave-3" x="397" y="294" width="4" height="22" rx="2" /><rect class="soundwave-4" x="407" y="296" width="4" height="18" rx="2" /><rect class="soundwave-5" x="417" y="299" width="4" height="12" rx="2" /></g><path d="M 305,204 C 350,192 415,192 455,202 L 365,335 C 320,328 288,308 282,272 C 278,240 288,215 305,204 Z" fill="url(#glassReflect)" /></g>
    <g filter="url(#neonGlow)"><path d="M 160,210 Q 160,228 178,228 Q 160,228 160,246 Q 160,228 142,228 Q 160,228 160,210 Z" fill="#22d3ee" /><path d="M 550,115 Q 550,128 563,128 Q 550,128 550,141 Q 550,128 537,128 Q 550,128 550,115 Z" fill="#ec4899" /><path d="M 225,525 Q 225,537 237,537 Q 225,537 225,549 Q 225,537 213,537 Q 225,537 225,525 Z" fill="#a855f7" /></g>
  </g>
</svg>
